<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Product Management Systems</title>
    <!-- Link to the detached standalone stylesheet file -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    
    <!-- Theme Toggle Settings Layout Button Panel Component -->
    <div class="theme-toggle-container">
        <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 Toggle Dark Mode</button>
    </div>

    <h2>📦 Enterprise Inventory Dashboard</h2>
    <div class="row">
        
        <!-- Left Column: Entry Management Form Card Module -->
        <div class="col-form">
            <div class="card">
                <h4>Product Operations</h4>
                <form th:action="@{/saveProduct}" th:object="${product}" method="POST">
                    <!-- Hidden field populated automatically by Hibernate during updates -->
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="form-group">
                        <label>Product Descriptive Name</label>
                        <input type="text" th:field="*{name}" placeholder="e.g., Laptop Computer" required>
                    </div>
                    <div class="form-group">
                        <label>Inventory Classification Type</label>
                        <input type="text" th:field="*{type}" placeholder="e.g., Electronics" required>
                    </div>
                    <div class="form-group">
                        <label>Unit Base Price (₹)</label>
                        <input type="number" step="0.01" th:field="*{price}" placeholder="e.g., 45000.00" required>
                    </div>
                    <button type="submit" class="btn">Save Asset Record</button>
                </form>
            </div>
        </div>

        <!-- Right Column: Stock Grid Layout with Interactive Client-Side Search -->
        <div class="col-table">
            <div class="card" style="padding: 24px; overflow: hidden;">
                <h4 style="border:none; margin-bottom: 15px;">Active Warehouse Stock</h4>
                
                <!-- Live Search Interface Feature Input Field Component -->
                <input type="text" id="liveSearchInput" class="search-input" placeholder="🔍 Search assets by name or classification category...">
                
                <table id="inventoryTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Asset Name</th>
                            <th>Category Type</th>
                            <th>Price</th>
                            <th style="text-align: center;">Controls</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prod : ${listProducts}">
                            <td th:text="${prod.id}" style="font-weight: 600;"></td>
                            <td th:text="${prod.name}" class="asset-name"></td>
                            <td>
                                <span class="asset-type-badge asset-type" th:text="${prod.type}"></span>
                            </td>
                            <td th:text="'₹' + ${prod.price}" style="font-weight: 600; color: #2563eb;"></td>
                            <td style="text-align: center;">
                                <a th:href="@{/showFormForUpdate/{id}(id=${prod.id})}" class="btn-action btn-edit">Edit</a>
                                <a th:href="@{/deleteProduct/{id}(id=${prod.id})}" class="btn-action btn-delete" onclick="return confirm('Confirm entry deletion?')">Delete</a>
                            </td>
                        </tr>
                        <!-- Fallback message if list is empty -->
                        <tr th:if="${listProducts.isEmpty()}">
                            <td colspan="5" class="empty-row">Warehouse system database empty.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- Injection of the detached logic script asset handler -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
