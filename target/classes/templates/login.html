<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Access Portal</title>
    <!-- We reuse our main CSS file to maintain theme consistency -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            text-align: center;
        }
        .login-logo {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .error-banner {
            background-color: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid #fca5a5;
        }
        .logout-banner {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid #7dd3fc;
        }
    </style>
</head>
<body>
<div class="container">
    
    <!-- Floating Dark Mode Selector -->
    <div class="theme-toggle-container">
        <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 Toggle Dark Mode</button>
    </div>

    <div class="login-wrapper">
        <div class="card login-card">
            <div class="login-logo">📦</div>
            <h2 style="margin-bottom: 10px;">Inventory System</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px;">Please sign in to access your dashboard management workspace.</p>

            <!-- Error Notification Banner handling login failures -->
            <div th:if="${param.error}" class="error-banner">
                ❌ Invalid username or access security credentials!
            </div>
            
            <!-- Safe Logout Confirmation message alert banner -->
            <div th:if="${param.logout}" class="logout-banner">
                🔒 You have been securely logged out of the session.
            </div>

            <form th:action="@{/login}" method="POST">
                <div class="form-group" style="text-align: left;">
                    <label>Username / Employee ID</label>
                    <input type="text" name="username" placeholder="Enter username..." required autofocus>
                </div>
                
                <div class="form-group" style="text-align: left; margin-bottom: 30px;">
                    <label>Secure Security Password</label>
                    <input type="password" name="password" placeholder="Enter security key..." required>
                </div>
                
                <button type="submit" class="btn">Authenticate Portal Access</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
